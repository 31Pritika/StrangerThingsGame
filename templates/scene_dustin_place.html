{% extends "layout.html" %}
{% set bg_image = url_for('static', filename='images/dustin.png') %}

{% block title %}
    Stranger Things
{% endblock %}

{% block main %}
    <div action = "/scene_dustin_place"  class="home flex flex-col items-center text-center gap-4">
        <p id="line1" class="typing-text text-lg opacity-90" data-text="You grab a flashlight and head to Dustin's house."></p>
        <p id="line2" class="typing-text text-lg opacity-90" data-text="You avoid the creature and arrive safely."></p>

        <form id="action-form" method = "post" class = "flex flex-col gap-3 mt-4 opacity-0 transition-opacity duration-1000">  
            <button name = "continue" value = "continue" class = "{{ button_class }}">CONTINUE</button>
        </form>
    </div>

    
{% endblock %}
