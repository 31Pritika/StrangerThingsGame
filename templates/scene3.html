{% extends "layout.html" %}

{% set bg_image = url_for('static', filename='images/scene3.png') %}

{% block title %}
    Stranger Things
{% endblock %}

{% block main %}
    <div action = "/scene3"  class="home flex flex-col items-center text-center gap-4">
        <p id="line1" class="typing-text text-lg opacity-90" data-text="Dustin doesn't believe you at first."></p>
        <p id="line2" class="typing-text text-lg opacity-90" data-text="Nancy calls and confirms she saw the creature too."></p>
        <p id="line3" class="typing-text text-lg opacity-90" data-text="You assemble the group."></p>
        

        <form id="action-form" method = "post" class = "flex flex-col gap-3 mt-4 opacity-0 transition-opacity duration-1000">  
            <button name = "continue" value = "continue" class = "{{ button_class }}">CONTINUE</button>
        </form>
    </div>

    {# JS moved to layout.html #}
{% endblock %}
