{% extends "layout.html" %}

{% set bg_image = url_for('static', filename='images/demoooo.png') %}

{% block title %}
    Stranger Things
{% endblock %}

{% block main %}
    <div  class="home flex flex-col items-center text-center gap-4">
        <p id="line1" class="typing-text text-lg opacity-90" data-text="You decide to let Eleven fight the Demogorgon alone."></p>
        <p id="line2" class="typing-text text-lg opacity-90" data-text="Eleven bravely faces the creature, using her powers."></p>
        <p id="line3" class="typing-text text-lg opacity-90" data-text="But without your help, the Demogorgon is too strong."></p>
        <p id="line4" class="typing-text text-lg opacity-90" data-text="Eleven is overwhelmed, and the creature turns its attention to you and your friends."></p>
        <form id="action-form" method="post" class = "flex flex-col gap-3 mt-4 opacity-0 transition-opacity duration-1000">
            <button name="continue" value="continue" class = "{{ button_class }}">CONTINUE</button>
            {# JS moved to layout.html #}
        }

        document.addEventListener('DOMContentLoaded',run);
    </script>
{% endblock %}
